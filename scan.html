<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sign in — Sky Team Ife</title>
<meta name="theme-color" content="#0C2C5A">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=Lora:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  body{background:var(--bg)}
  .scan-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:14px}
  .scan-card{width:100%;max-width:430px;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 18px 44px -20px rgba(12,44,90,.4)}
  .scan-card .phone-b{padding:20px}
  .scan-foot{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);font-weight:700}
  .auto button{width:100%}
  .digit input{width:66px;height:68px;font-size:26px}
</style>
</head>
<body>
<div id="root"></div>
<script src="config.js"></script>
<script src="js/scan.js"></script>
</body>
</html>
