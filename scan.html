<script>
/* Same guard as the app: set the accent before the first paint. */
(function () {
  try {
    var h = parseInt(localStorage.getItem('sti-hue'), 10);
    if (!isNaN(h)) document.documentElement.style.setProperty('--hue', ((h % 360) + 360) % 360);
  } catch (e) { /* the stylesheet's own default stands */ }
})();
</script>
</head>
<body>
<div id="root"><div class="loading"><div class="spinner"></div></div></div>
