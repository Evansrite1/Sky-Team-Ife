<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Team Ife — Center &amp; Office Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#14417F; --primary-600:#1D5AAD; --primary-400:#4A85D6;
  --primary-050:#EAF1FB; --navy:#0C2C5A; --navy-700:#123A6E;
  --accent:#B4832B; --accent-600:#986D1F; --accent-050:#FBF2DE;
  --bg:#F5F8FC; --surface:#FFFFFF; --border:#DCE3ED; --border-strong:#C3CFDF;
  --text:#0F1B2D; --muted:#62718A; --faint:#8B98AC;
  --success:#16794F; --success-050:#E7F4EE;
  --warning:#B26B00; --error:#B3261E; --error-050:#FBEBEA;
  --font-ui:'Urbanist',system-ui,sans-serif; --font-ed:'Lora',Georgia,serif;
  --r:10px; --r-lg:16px;
  --sh:0 1px 2px rgba(15,27,45,.06),0 1px 3px rgba(15,27,45,.04);
  --sh-lift:0 10px 28px -12px rgba(12,44,90,.28);
  --sb:252px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary-400);outline-offset:2px;border-radius:6px}
svg{display:block}
.ed{font-family:var(--font-ed)}

/* ---------- AUTH ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.auth-art{background:var(--navy);color:#fff;padding:56px 56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-art:after{content:"";position:absolute;inset:0;background:radial-gradient(900px 520px at 82% 8%,rgba(74,133,214,.34),transparent 62%);pointer-events:none}
.auth-art-inner{position:relative;z-index:2;max-width:460px}
.auth-h{font-family:var(--font-ed);font-size:40px;line-height:1.14;font-weight:600;margin:26px 0 16px;letter-spacing:-.01em}
.auth-sub{color:#B9CBE6;font-size:16px;max-width:400px}
.auth-flow{position:relative;z-index:2;margin-top:40px;border-top:1px solid rgba(255,255,255,.16);padding-top:22px}
.auth-flow li{display:flex;gap:14px;align-items:flex-start;padding:9px 0;color:#CBD9EC;font-size:14px;list-style:none}
.auth-flow .dot{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);flex:0 0 auto;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.auth-form{padding:56px 48px;display:flex;align-items:center;justify-content:center;background:var(--surface)}
.auth-box{width:100%;max-width:432px}
.auth-eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.auth-title{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:8px 0 6px}
.demo-list{display:flex;flex-direction:column;gap:12px;margin:26px 0 22px}
.demo{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:var(--r);padding:15px 16px;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.demo:hover{border-color:var(--primary-400);box-shadow:var(--sh-lift);transform:translateY(-2px)}
.demo-ic{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;background:var(--primary-050);color:var(--primary);flex:0 0 auto}
.demo.gold .demo-ic{background:var(--accent-050);color:var(--accent-600)}
.demo-nm{font-weight:700;font-size:15px}
.demo-ds{font-size:13px;color:var(--muted);line-height:1.35}
.demo-go{margin-left:auto;color:var(--faint);transition:transform .18s ease,color .18s ease}
.demo:hover .demo-go{transform:translateX(3px);color:var(--primary)}
.auth-note{font-size:13px;color:var(--muted);border-top:1px solid var(--border);padding-top:18px}
.auth-note a{color:var(--primary);font-weight:600;text-decoration:underline;text-underline-offset:2px}
@media (max-width:900px){.auth{grid-template-columns:1fr}.auth-art{padding:36px 26px}.auth-h{font-size:30px}.auth-form{padding:32px 22px}.auth-flow{display:none}}

/* ---------- SHELL ---------- */
.shell{display:flex;min-height:100vh}
.sb{width:var(--sb);flex:0 0 var(--sb);background:var(--navy);color:#fff;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40}
.sb-top{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;font-size:17px}
.brand-mk{width:28px;height:28px;border-radius:7px;background:#fff;color:var(--navy);display:grid;place-items:center;font-size:14px;font-weight:800;font-family:var(--font-ed)}
.sb-role{margin-top:14px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:9px 11px}
.sb-role-l{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#9DB6D8;font-weight:700}
.sb-role-v{font-size:14px;font-weight:600;margin-top:2px}
.sb-nav{flex:1;overflow-y:auto;padding:14px 12px}
.sb-grp{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#7F97BB;font-weight:700;padding:14px 8px 7px}
.sb-a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;color:#D3E0F1;font-size:14px;font-weight:500;transition:background .15s ease,color .15s ease,transform .15s ease}
.sb-a:hover{background:rgba(255,255,255,.09);color:#fff;transform:translateX(2px)}
.sb-a.on{background:#fff;color:var(--navy);font-weight:700}
.sb-a svg{flex:0 0 auto;opacity:.9}
.sb-a .cnt{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.14);padding:1px 7px;border-radius:20px}
.sb-a.on .cnt{background:var(--primary-050);color:var(--primary)}
.sb-btm{padding:14px 12px;border-top:1px solid rgba(255,255,255,.12)}
.sb-user{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px}
.av{width:32px;height:32px;border-radius:50%;background:var(--primary-600);display:grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 auto}
.sb-user-nm{font-size:13px;font-weight:600;line-height:1.25}
.sb-user-em{font-size:11px;color:#9DB6D8}
.sb-out{width:100%;display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;color:#C3D5EC;font-size:13px;font-weight:600;margin-top:4px;transition:background .15s ease,color .15s ease}
.sb-out:hover{background:rgba(255,255,255,.09);color:#fff}
.scrim{display:none}

.main{flex:1;min-width:0;margin-left:var(--sb)}
.tb{position:sticky;top:0;z-index:30;background:rgba(245,248,252,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:14px 32px;display:flex;align-items:center;gap:18px}
.burger{display:none;width:38px;height:38px;border:1px solid var(--border);border-radius:9px;background:var(--surface);place-items:center}
.crumb{font-size:12px;color:var(--muted);font-weight:500}
.crumb a:hover{color:var(--primary);text-decoration:underline}
.tb-t{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.wk{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:6px 8px 6px 12px}
.wk-l{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.wk select{border:none;background:none;font-weight:600;font-size:13px;padding:2px 4px;cursor:pointer}
.page{padding:28px 32px 72px;max-width:1360px}
@media (max-width:1024px){
  .sb{transform:translateX(-100%);transition:transform .26s cubic-bezier(.4,0,.2,1)}
  body.nav-open .sb{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(12,44,90,.42);z-index:39;animation:fade .2s ease}
  .main{margin-left:0}
  .burger{display:grid}
  .tb{padding:12px 18px}
  .page{padding:20px 18px 64px}
}

/* ---------- PRIMITIVES ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:9px;font-weight:600;font-size:14px;border:1px solid transparent;transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-p{background:var(--primary);color:#fff}
.btn-p:hover{background:var(--primary-600);box-shadow:0 8px 18px -8px rgba(20,65,127,.6)}
.btn-g{background:var(--surface);border-color:var(--border-strong);color:var(--text)}
.btn-g:hover{border-color:var(--primary-400);color:var(--primary);box-shadow:var(--sh)}
.btn-a{background:var(--accent);color:#fff}
.btn-a:hover{background:var(--accent-600)}
.btn-d{background:var(--surface);border-color:#E7C9C6;color:var(--error)}
.btn-d:hover{background:var(--error-050)}
.btn-sm{height:33px;padding:0 12px;font-size:13px;border-radius:8px}
.btn-ghost{color:var(--primary);padding:0 8px}
.btn-ghost:hover{background:var(--primary-050)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.card-t{font-size:15px;font-weight:700;letter-spacing:-.01em}
.card-s{font-size:12.5px;color:var(--muted);margin-top:1px}
.card-h .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:20px}
.card-f{padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-3-2{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g-3-2{grid-template-columns:1fr}}
@media (max-width:640px){.g2,.g4{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh);transition:transform .18s ease,box-shadow .18s ease}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh-lift)}
.kpi-l{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:7px}
.kpi-v{font-size:30px;font-weight:700;letter-spacing:-.03em;margin:9px 0 2px;font-variant-numeric:tabular-nums}
.kpi-m{font-size:12.5px;color:var(--muted)}
.trend{font-weight:700;font-size:12.5px}
.up{color:var(--success)} .dn{color:var(--error)}

table{width:100%;border-collapse:collapse}
.tw{overflow-x:auto}
th{text-align:left;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:11px 16px;border-bottom:1px solid var(--border);white-space:nowrap;background:#FAFCFE}
td{padding:13px 16px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tr.clk{cursor:pointer;transition:background .14s ease}
tr.clk:hover{background:var(--primary-050)}
tr.clk:hover .go{opacity:1;transform:translateX(2px)}
.go{opacity:0;color:var(--primary);transition:.16s ease}
.num{font-variant-numeric:tabular-nums;text-align:right}
th.num{text-align:right}
.nm{font-weight:600}
.sub{font-size:12.5px;color:var(--muted)}
.rk{width:26px;height:26px;border-radius:7px;background:var(--primary-050);color:var(--primary);display:grid;place-items:center;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.rk.g1{background:var(--accent);color:#fff}
.rk.g2{background:var(--accent-050);color:var(--accent-600)}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;border:1px solid transparent;white-space:nowrap}
.t-b{background:var(--primary-050);color:var(--primary);border-color:#CFE0F6}
.t-gold{background:var(--accent-050);color:var(--accent-600);border-color:#E8D3A4}
.t-ok{background:var(--success-050);color:var(--success);border-color:#C6E5D6}
.t-warn{background:#FDF3E3;color:var(--warning);border-color:#EFD9AF}
.t-err{background:var(--error-050);color:var(--error);border-color:#EFCDCA}
.t-mut{background:#F1F4F9;color:var(--muted);border-color:var(--border)}
.gold-dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}

.bar{height:7px;border-radius:20px;background:#EDF1F7;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:20px;background:var(--primary);animation:grow .7s cubic-bezier(.3,1,.4,1) both}
.bar.gold>i{background:var(--accent)}
@keyframes grow{from{width:0}}

.chart{display:flex;align-items:flex-end;gap:14px;height:172px;padding-top:8px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.col-b{width:100%;max-width:46px;background:var(--primary-050);border-radius:7px 7px 3px 3px;position:relative;transition:background .18s ease}
.col-b>span{position:absolute;inset:auto 0 0 0;background:var(--primary);border-radius:7px 7px 3px 3px;animation:rise .8s cubic-bezier(.3,1,.4,1) both}
.col.hi .col-b>span{background:var(--accent)}
.col:hover .col-b{background:#DCE8F8}
.col-l{font-size:11px;color:var(--muted);font-weight:600;text-align:center}
.col-v{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
@keyframes rise{from{height:0!important}}

.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:12.5px;font-weight:700;color:var(--text)}
.hint{font-size:12px;color:var(--muted)}
.inp{height:42px;border:1px solid var(--border-strong);border-radius:9px;padding:0 12px;background:var(--surface);width:100%;transition:border-color .15s ease,box-shadow .15s ease}
textarea.inp{height:auto;padding:10px 12px;min-height:88px;resize:vertical;line-height:1.5}
select.inp{cursor:pointer;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2362718A' stroke-width='2.2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:34px}
.inp:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(74,133,214,.2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--border-strong);background:var(--surface);border-radius:20px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted);transition:.15s ease}
.chip:hover{border-color:var(--primary-400);color:var(--primary)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}

.empty{text-align:center;padding:44px 24px}
.empty-ic{width:52px;height:52px;border-radius:13px;background:var(--primary-050);color:var(--primary);display:grid;place-items:center;margin:0 auto 14px}
.empty-t{font-weight:700;font-size:15px}
.empty-d{font-size:13.5px;color:var(--muted);max-width:340px;margin:5px auto 16px}

.note{display:flex;gap:11px;padding:13px 15px;border-radius:var(--r);font-size:13.5px;line-height:1.5;border:1px solid}
.note svg{flex:0 0 auto;margin-top:1px}
.n-b{background:var(--primary-050);border-color:#CFE0F6;color:#123A6E}
.n-gold{background:var(--accent-050);border-color:#E8D3A4;color:#6B4D14}
.n-err{background:var(--error-050);border-color:#EFCDCA;color:#8C1D18}
.n-ok{background:var(--success-050);border-color:#C6E5D6;color:#0E5637}

.dl{display:grid;grid-template-columns:auto 1fr;gap:11px 22px;font-size:14px}
.dl dt{color:var(--muted);font-size:13px}
.dl dd{font-weight:600;text-align:right}

.tabs{display:flex;gap:3px;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto}
.tab{padding:10px 15px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:.15s ease}
.tab:hover{color:var(--text)}
.tab.on{color:var(--primary);border-bottom-color:var(--primary)}

/* QR ticket — signature element */
.qr-wrap{display:flex;gap:24px;align-items:stretch;flex-wrap:wrap}
.ticket{background:var(--navy);border-radius:var(--r-lg);padding:22px;color:#fff;width:290px;flex:0 0 auto;position:relative;overflow:hidden}
.ticket:after{content:"";position:absolute;left:0;right:0;bottom:78px;border-top:2px dashed rgba(255,255,255,.28)}
.ticket-l{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#9DB6D8;font-weight:700}
.qr-box{background:#fff;border-radius:11px;padding:12px;margin:13px 0 15px}
.qr-box svg{width:100%;height:auto}
.qr-box rect.m{animation:pop .5s cubic-bezier(.3,1.4,.5,1) both}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
.ticket-code{font-family:var(--font-ed);font-size:17px;font-weight:600;letter-spacing:.05em}
.ticket-meta{padding-top:16px;margin-top:14px;font-size:12.5px;color:#B9CBE6;display:flex;flex-direction:column;gap:4px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7BE0AE}
.live i{width:7px;height:7px;border-radius:50%;background:#39D98A;animation:pulse 1.9s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.35)}}
.void .qr-box{filter:grayscale(1);opacity:.4}
.void-stamp{position:absolute;top:96px;left:50%;transform:translate(-50%,-50%) rotate(-12deg);border:3px solid var(--error);color:var(--error);font-weight:800;letter-spacing:.16em;font-size:15px;padding:5px 14px;border-radius:7px;background:rgba(255,255,255,.94)}

.log{display:flex;flex-direction:column;gap:0}
.sched{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--border);border-radius:var(--r);transition:border-color .16s ease,transform .16s ease,box-shadow .16s ease}
.sched:hover{border-color:var(--primary-400);transform:translateX(2px);box-shadow:var(--sh)}
.sched-ic{width:34px;height:34px;border-radius:9px;background:var(--primary-050);color:var(--primary);display:grid;place-items:center;flex:0 0 auto}
.sched-ic.ev{background:var(--accent-050);color:var(--accent-600)}
.sched-b{display:flex;flex-direction:column;flex:1;min-width:0}
.sched-t{font-weight:600;font-size:14px}
.sched-n{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;text-align:right}
td.wrap{white-space:normal;line-height:1.45}
tfoot td{background:#F7FAFD;border-top:2px solid var(--border-strong);font-weight:600;font-size:13.5px;padding:12px 16px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--muted)}
.log-i{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.log-i:last-child{border-bottom:none}
.log-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto}
.log-ic.ok{background:var(--success-050);color:var(--success)}
.log-ic.no{background:var(--error-050);color:var(--error)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--muted)}

/* modal + toast */
.mo{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(12,44,90,.44);animation:fade .18s ease}
.mo-c{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;box-shadow:0 30px 70px -20px rgba(12,44,90,.5);animation:pop-in .24s cubic-bezier(.3,1.2,.5,1) both}
.mo-c.wide{max-width:680px}
@keyframes pop-in{from{opacity:0;transform:translateY(14px) scale(.98)}}
@keyframes fade{from{opacity:0}}
.mo-h{padding:20px 22px 0;display:flex;gap:14px;align-items:flex-start}

  { id: 'o2', centerId: 'c1', name: 'Moore Office', code: 'LG-02', manager: 'Tunde Bakare', email: 'moore@skyteamife.com', area: 'Moore', address: '5 Moore Road, Ile-Ife', joined: '20 Jan 2026' },

const FIRST = ['Chidi', 'Amaka', 'Segun', 'Zainab', 'Obinna', 'Funke', 'Yusuf', 'Chioma', 'Bode', 'Halima', 'Uche', 'Temi', 'Ibrahim', 'Nkechi', 'Femi', 'Aisha', 'Emeka', 'Tolu', 'Sani', 'Grace', 'Kunle', 'Ijeoma', 'Abdul', 'Peace', 'Dare', 'Rukayat', 'Chika', 'Seyi', 'Maryam', 'Paul', 'Ada', 'Lanre', 'Hadiza', 'Ezra', 'Bukola', 'Ismail', 'Nneka', 'Wale', 'Sarah', 'Kabiru'];
const LAST = ['Okonkwo', 'Adeyemi', 'Balogun', 'Mohammed', 'Nwachukwu', 'Ojo', 'Ibrahim', 'Eze', 'Salami', 'Abubakar', 'Igwe', 'Fashola', 'Bello', 'Anyanwu', 'Olawale', 'Sule', 'Ugochukwu', 'Aluko', 'Garba', 'Effiong', 'Momoh', 'Chukwu', 'Oyelaran', 'Danladi', 'Nkemdirim'];

let dCount = 0;
offices.forEach(o => {

    });

const reports = [];
const skip = {

function officeWeek(oid, wid) {
  const o = officeById(oid), r = reportFor(oid, wid), ds = distsOf(oid), ids = ds.map(d => d.id);
  let acc = 0, elig = 0;
  eventsIn(o.centerId, wid).forEach(e => {
    elig += ds.filter(d => e.elig === 'sm' ? isSmPlus(d) : true).length;
    acc += e.scans.filter(s => s.status === 'Accepted' && ids.includes(s.distributorId)).length;
  });
  return { office: o, report: r, submitted: !!r, orders: r ? r.orders : 0, amount: r ? r.amount : 0,
    att: elig ? (acc / elig) * 100 : 0, attAccepted: acc, attEligible: elig, size: ds.length };
}
function centerWeek(cid, wid) {
  const rows = officesOf(cid).map(o => officeWeek(o.id, wid));
  return { rows, offices: rows.length, submitted: rows.filter(r => r.submitted).length,
    orders: rows.reduce((a, r) => a + r.orders, 0), amount: rows.reduce((a, r) => a + r.amount, 0),
    dists: rows.reduce((a, r) => a + r.size, 0),
    att: rows.length ? rows.reduce((a, r) => a + r.att, 0) / rows.length : 0,
    newNiches: rows.reduce((a, r) => a + (r.report ? r.report.newNiches.length : 0), 0) };
}

function nicheTally(rs) {

}

function barChart(items, hiIdx) {
  const max = Math.max(...items.map(i => i.v), 1);
  return `<div class="chart">${items.map((i, x) => `<div class="col ${x === hiIdx ? 'hi' : ''}" title="${esc(i.label)}: ${esc(String(i.display !== undefined ? i.display : i.v))}">

    <div class="col-l">${esc(i.label)}</div></div>`).join('')}</div>`;
}
function lineChart(items, hiIdx, area) {
  const W = 620, H = 186, pl = 12, pr = 12, pt = 26, pb = 26;
  const max = Math.max(...items.map(i => i.v), 1) * 1.15;
  const n = Math.max(items.length - 1, 1);
  const x = i => pl + (i * (W - pl - pr)) / n;
  const y = v => pt + (1 - v / max) * (H - pt - pb);
  const pts = items.map((it, i) => [x(i), y(it.v)]);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  return `<svg class="lc" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="agrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4A85D6" stop-opacity=".34"/><stop offset="100%" stop-color="#4A85D6" stop-opacity="0"/></linearGradient></defs>
    ${[0, .5, 1].map(f => `<line class="grid-l" x1="${pl}" y1="${(pt + f * (H - pt - pb)).toFixed(1)}" x2="${W - pr}" y2="${(pt + f * (H - pt - pb)).toFixed(1)}"/>`).join('')}
    ${area ? `<path class="ar" d="${d} L${x(items.length - 1).toFixed(1)} ${H - pb} L${pl} ${H - pb} Z"/>` : ''}
    <path class="ln" d="${d}"/>
    ${items.map((it, i) => `<g class="pg"><text class="vlbl" x="${x(i).toFixed(1)}" y="${(y(it.v) - 11).toFixed(1)}">${esc(String(it.display !== undefined ? it.display : it.v))}</text>

  </svg>`;
}

    : `<tr><td colspan="${cols.length}">${empty(opts.emptyIcon || 'file', opts.emptyTitle || 'Nothing here yet', opts.emptyDesc || 'Records appear here as they come in.')}</td></tr>`}</tbody>
  ${opts.foot && rows.length ? `<tfoot><tr>${opts.foot.map((c, i) => `<td class="${cols[i] && cols[i].num ? 'num' : ''}">${c}</td>`).join('')}</tr></tfoot>` : ''}</table></div>`;
}
function qrSvg(seed, animate) {
  let h = 0; for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) % 99991;
  const n = 21, cell = 100 / n, out = [];
  const finder = (r, c) => (r < 7 && c < 7) || (r < 7 && c > 13) || (r > 13 && c < 7);
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    if (finder(r, c)) continue;
    h = (h * 1103515245 + 12345) % 2147483648;
    if ((h >> 16) % 100 < 47) out.push(`<rect class="${animate ? 'm' : ''}" x="${(c * cell).toFixed(2)}" y="${(r * cell).toFixed(2)}" width="${cell.toFixed(2)}" height="${cell.toFixed(2)}" ${animate ? `style="animation-delay:${(((r + c) % 12) * 34)}ms"` : ''}/>`);
  }
  const eye = (x, y) => `<rect x="${x}" y="${y}" width="${(cell * 7).toFixed(2)}" height="${(cell * 7).toFixed(2)}" rx="2"/><rect x="${(x + cell).toFixed(2)}" y="${(y + cell).toFixed(2)}" width="${(cell * 5).toFixed(2)}" height="${(cell * 5).toFixed(2)}" fill="#fff"/><rect x="${(x + cell * 2).toFixed(2)}" y="${(y + cell * 2).toFixed(2)}" width="${(cell * 3).toFixed(2)}" height="${(cell * 3).toFixed(2)}" rx="1"/>`;
  return `<svg viewBox="0 0 100 100" fill="#0C2C5A">${out.join('')}${eye(0, 0)}${eye(100 - cell * 7, 0)}${eye(0, 100 - cell * 7)}</svg>`;
}
const ticket = (e, animate) => `<div class="ticket ${e.status === 'closed' ? 'void' : ''}">

/* ================================ MONTHLY SUMMARY ================================ */
VIEWS.monthly = () => state.role === 'of' ? officeMonthly() : adminMonthly();

function adminMonthly() {
  const m = monthById(state.month), prev = MONTHS[MONTHS.findIndex(x => x.id === m.id) - 1];
  const rows = centers.map(c => ({ c, m: centerMonth(c.id, m.id), p: prev ? centerMonth(c.id, prev.id) : null }));
  const t = rows.reduce((a, x) => ({ o: a.o + x.m.orders, v: a.v + x.m.amount, s: a.s + x.m.submitted, d: a.d + x.m.due }), { o: 0, v: 0, s: 0, d: 0 });
  const pt = prev ? rows.reduce((a, x) => a + x.p.orders, 0) : 0;
  const best = rankOffices(offices.map(o => ({ ...officeMonth(o.id, m.id), office: o })));
  const tally = nicheTally(reportsIn({ month: m.id })).slice(0, 6);
  return { title: 'Monthly summary', crumbs: `${m.label} · ${m.weeks.length} weeks`, picker: 'month', html: `
  <div class="stack stagger">
    <div class="grid g4">
      ${kpi('Orders', t.o, prev ? change(t.o, pt) + ' vs ' + prev.label.split(' ')[0] : 'First month on record', 'trend')}
      ${kpi('Order amount', usd(t.v), usdFull(t.v), 'cash')}
      ${kpi('Reports in', `${t.s}<span style="font-size:17px;color:var(--faint)">/${t.d}</span>`, 'Every office, every week', 'file')}
      ${kpi('Most sold niche', tally.length ? esc(tally[0].niche) : '—', tally.length ? `Named on ${tally[0].count} reports` : '', 'star')}
    </div>
    <div class="card"><div class="card-h"><div><div class="card-t">Centers in ${m.label}</div><div class="card-s">Month totals, not a week snapshot</div></div></div>
      ${table([{ label: 'Center' }, { label: 'Area' }, { label: 'Orders', num: true }, { label: 'Order amount', num: true }, { label: 'vs last month', num: true }, { label: 'Reports in', num: true }, { label: 'Best office' }, { label: '' }],
        rows.map(x => ({ href: link('center', x.c.id), cells: [
          `<div class="nm">${esc(x.c.name)}</div><div class="sub">${esc(x.c.leader)}</div>`, esc(x.c.area),
          `<b>${x.m.orders}</b>`, usd(x.m.amount), x.p ? change(x.m.orders, x.p.orders) : '<span class="sub">—</span>',
          `${x.m.submitted}/${x.m.due}`,
          x.m.best ? `<span class="nm">${esc(x.m.best.office.name)}</span><div class="sub">${usd(x.m.best.amount)}</div>` : '—',
          `<span class="go">${ico('right', 16)}</span>`] })),
        { foot: ['<b>Platform total</b>', '', `<b>${t.o}</b>`, usd(t.v), prev ? change(t.o, pt) : '', `${t.s}/${t.d}`, '', ''] })}
    </div>
    <div class="grid g2">
      ${chartCard('Week by week', 'Orders across ' + m.label, m.weeks.map(wid => ({ label: wLabel(weekById(wid)), v: centers.reduce((a, c) => a + centerWeek(c.id, wid).orders, 0) })))}
      <div class="card"><div class="card-h"><div><div class="card-t">Niches that sold</div><div class="card-s">How often each was named as a source of orders</div></div></div>
        <div class="card-b stack" style="gap:13px">
          ${tally.map((n, i) => `<div><div class="row" style="justify-content:space-between;margin-bottom:5px">
            <span style="font-size:13.5px;font-weight:600">${i === 0 ? `<span class="gold-dot" style="display:inline-block;margin-right:6px"></span>` : ''}${esc(n.niche)}</span>
            <span class="num" style="font-weight:700">${n.count}</span></div>${bar(n.count, tally[0].count, i === 0)}</div>`).join('')}
        </div></div>
    </div>
    <div class="card"><div class="card-h"><div><div class="card-t">Top offices this month</div><div class="card-s">By order amount</div></div></div>
      ${table([{ label: '#' }, { label: 'Office' }, { label: 'Center' }, { label: 'Orders', num: true }, { label: 'Order amount', num: true }, { label: '' }],
        best.slice(0, 8).map((r, i) => ({ href: link('office', r.office.id), cells: [
          `<span class="rk ${i === 0 ? 'g1' : i === 1 ? 'g2' : ''}">${i + 1}</span>`,
          `<div class="nm">${esc(r.office.name)}</div><div class="sub">${esc(r.office.area)}</div>`,
          esc(centerById(r.office.centerId).name), r.orders, usd(r.amount), `<span class="go">${ico('right', 16)}</span>`] })))}
    </div>
  </div>` };
}

VIEWS.event = id => {
  const e = eventById(id) || attEvents[0], c = centerById(e.centerId);
  const pool = eligiblePool(e), scanned = e.scans.map(s => s.distributorId);
  const missing = pool.filter(d => !scanned.includes(d.id));
  const back = e.kind === 'training' ? 'trainings' : 'events';
  const own = state.role === 'of' && c.id === myCenter().id;
  return { title: e.name, crumbs: `<a href="${link(back)}">${e.kind === 'training' ? 'Trainings' : 'Center events'}</a> / ${esc(c.name)} / ${esc(e.date)}`, picker: null, html: `
  <div class="stack stagger">
    <div class="grid g-3-2">
      <div class="grid g2" style="align-content:start">
        ${kpi('People present', accepted(e), `of ${pool.length} eligible`, 'users')}
        ${kpi('Turnout', pct(accepted(e) / Math.max(pool.length, 1) * 100), ELIG[e.elig].label, 'chart')}
        ${kpi('Turned away', rejected(e), 'Phone already used, or not eligible', 'alert')}
        ${kpi('Did not come', missing.length, 'Eligible but never scanned', 'clock')}

      <div>${ticket(e, e.status === 'live')}</div>

    ${own && e.status !== 'closed' ? `<div class="row">
      ${e.status === 'live'
        ? `<button class="btn btn-p btn-sm" data-act="scan-open" data-id="${e.id}">${ico('phone', 15)}Try the scan-in screen</button>
           <button class="btn btn-g btn-sm" data-act="sim-dupe" data-id="${e.id}">Same phone twice</button>
           <button class="btn btn-d btn-sm" data-act="close-scan" data-id="${e.id}">Close scanning</button>`
        : `<button class="btn btn-p btn-sm" data-act="open-scan" data-id="${e.id}">${ico('qr', 15)}Open scanning now</button>`}</div>` : ''}
    <div class="card"><div class="card-h"><div><div class="card-t">Who came in</div><div class="card-s">${e.scans.length} attempts on this code</div></div></div>
      ${table([{ label: 'Name' }, { label: 'Status' }, { label: 'Office' }, { label: 'Time' }, { label: 'Phone used' }, { label: 'Result' }],
        e.scans.slice().reverse().map(s => { const d = distById(s.distributorId); return { cells: [
          distName(d), statusTag(d.status), esc(officeById(d.officeId).name), esc(s.time), deviceTag(s.device),

/* ================================ WEEKLY REPORTS ================================ */
VIEWS.reports = () => state.role === 'of' ? officeReports() : adminReports();

/* ============================ ROUTER ============================ */
function route() {
  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const root = $('#root');
  closeModal();
  document.body.classList.remove('nav-open');
  if (!p.length || p[0] === 'login') { state.role = null; root.innerHTML = loginView(); return; }
  if (p[0] === 'signup') { root.innerHTML = signupView(); return; }
  if (p[0] === 'forgot') { root.innerHTML = forgotView(); return; }
  if (!ROLES[p[0]]) { location.hash = '#/login'; return; }
  state.role = p[0];
  const page = p[1] || 'dashboard', id = p[2];
  if (!VIEWS[page]) { location.hash = link('dashboard'); return; }
  const v = VIEWS[page](id);
  root.innerHTML = `<div class="shell">${sidebar(ACTIVE[page] || page)}<div class="scrim" data-act="nav"></div>
    <main class="main">${topbar(v)}<div class="page enter">${v.html}</div></main></div>`;
  window.scrollTo(0, 0);
  state.moves++;
  if (state.tourSeen && !state.tourDone && state.moves === 5 && !state.nudged) {
    state.nudged = true;
    setTimeout(() => toast('Still finding your way? Tap “Show me around” in the top bar for the 7-step walkthrough.'), 900);
  }
}
const go = hash => { location.hash = hash; };
const reload = () => route();

    if (step === 1) {
      const pool = distsOf(sc.officeId).filter(d => e.elig === 'sm' ? isSmPlus(d) : true);
      const q = (sc.q || '').toLowerCase();
      const hits = q ? pool.filter(d => d.name.toLowerCase().includes(q)) : pool;
      return `<div class="field"><label for="scan-q">Start typing your name</label>
        <input class="inp" id="scan-q" data-act="scan-search" placeholder="e.g. Chi…" value="${esc(sc.q || '')}" autocomplete="off">
        <div class="auto" id="scan-list">${hits.length ? hits.map(d => `<button data-act="scan-pick" data-id="${d.id}">

          <span class="mono" style="margin-left:auto">${esc(d.phone.slice(0, 3))}•••••${esc(d.phone.slice(-2))}</span></button>`).join('')
          : `<div style="padding:16px;text-align:center" class="sub">No name matches that in ${esc(officeById(sc.officeId).name)}.${e.elig === 'sm' ? ' Only Senior Managers and above are listed for this training.' : ''}</div>`}</div>
        <span class="hint">${pool.length} ${e.elig === 'sm' ? 'eligible people' : 'people'} in ${esc(officeById(sc.officeId).name)}.</span></div>`;
    }
    if (step === 2) { const d = distById(sc.distId);
      return `<div style="text-align:center">
        <div class="nm" style="font-size:16px">${esc(d.name)}</div><div class="sub" style="margin-bottom:16px">${esc(d.status)} · ${esc(officeById(d.officeId).name)}</div>
        <div class="field"><label style="text-align:center;display:block">Type digit ${sc.pos[0] + 1} and digit ${sc.pos[1] + 1} of your phone number</label>
          <div class="digit"><input class="inp" id="sd1" maxlength="1" inputmode="numeric" placeholder="${sc.pos[0] + 1}"><input class="inp" id="sd2" maxlength="1" inputmode="numeric" placeholder="${sc.pos[1] + 1}"></div>
          <span class="hint" style="display:block;text-align:center">Your number on file starts ${esc(d.phone.slice(0, 3))} and ends ${esc(d.phone.slice(-2))}.</span></div>
        ${sc.error ? `<div style="margin-top:12px">${note('err', 'alert', sc.error)}</div>` : ''}</div>`;
    }
    const d = distById(sc.distId);
    return sc.result === 'ok'
      ? `<div style="text-align:center"><div class="ok-mark">${ico('check', 30)}</div>
          <div style="font-size:17px;font-weight:700">You are marked present</div>
          <div class="sub" style="margin-top:4px">${esc(d.name)} · ${esc(officeById(d.officeId).name)}</div>
          <div class="sub" style="margin-top:10px">${esc(e.name)} · ${esc(e.date)} at ${esc(e.time)}</div>
          <div class="mono" style="margin-top:12px">Recorded from ${esc(sc.device)}</div></div>`
      : `<div style="text-align:center"><div class="no-mark">${ico('x', 30)}</div>
          <div style="font-size:17px;font-weight:700">This phone already signed someone in</div>
          <div class="sub" style="margin-top:6px;max-width:290px;margin-left:auto;margin-right:auto">One phone records one person per event. ${esc(sc.blockedBy)} was already recorded from it. Ask an office manager to add you by hand.</div></div>`;
  };
  const footer = () => {
    if (step === 0) return `<button class="btn btn-g" data-act="modal-close">Close</button>`;
    if (step === 1) return `<button class="btn btn-g" data-act="scan-back">${ico('left', 15)}Back</button>`;
    if (step === 2) return `<button class="btn btn-g" data-act="scan-back">${ico('left', 15)}Back</button><button class="btn btn-p" data-act="scan-verify">Mark me present</button>`;
    return `<button class="btn btn-g" data-act="modal-close">Done</button><button class="btn btn-p" data-act="scan-again">Next person</button>`;
  };
  $('#modal').innerHTML = `<div class="mo" data-act="modal-bg"><div class="mo-c" style="max-width:430px">
    <div class="phone" style="width:100%;border:none;border-radius:16px 16px 0 0;box-shadow:none">
      <div class="phone-top"><div class="t">${esc(e.name)}</div><div class="s">${esc(c.name)} · ${esc(e.date)} at ${esc(e.time)}</div></div>
      <div class="phone-b">
        <div class="steps">${[0, 1, 2, 3].map(x => `<i class="${x <= step ? 'on' : ''}"></i>`).join('')}</div>
        ${body()}
      </div></div>
    <div class="mo-f">${footer()}</div></div></div>`;

}

A['scan-search'] = el => {
  state.scan.q = el.value;
  const sc = state.scan, e = eventById(sc.eventId);
  const pool = distsOf(sc.officeId).filter(d => e.elig === 'sm' ? isSmPlus(d) : true);
  const q = sc.q.toLowerCase(), hits = q ? pool.filter(d => d.name.toLowerCase().includes(q)) : pool;
  const box = $('#scan-list'); if (!box) return;
  box.innerHTML = hits.length ? hits.map(d => `<button data-act="scan-pick" data-id="${d.id}">
    <span><span class="an">${esc(d.name)}</span><span class="sub" style="display:block">${esc(d.status)}</span></span>

    : `<div style="padding:16px;text-align:center" class="sub">No name matches that in ${esc(officeById(sc.officeId).name)}.${e.elig === 'sm' ? ' Only Senior Managers and above are listed for this training.' : ''}</div>`;
};
A['scan-pick'] = el => {
  const d = distById(el.dataset.id), len = d.phone.replace(/\D/g, '').length;
  let a = Math.floor(Math.random() * len), b = Math.floor(Math.random() * len);
  while (b === a) b = Math.floor(Math.random() * len);
  state.scan.distId = d.id; state.scan.pos = [Math.min(a, b), Math.max(a, b)]; state.scan.error = null; state.scan.step = 2;
  renderScan();
};
A['scan-back'] = () => { state.scan.step = Math.max(0, state.scan.step - 1); state.scan.error = null; renderScan(); };
A['scan-verify'] = () => {
  const sc = state.scan, e = eventById(sc.eventId), d = distById(sc.distId);
  const digits = d.phone.replace(/\D/g, '');
  const a = val('#sd1'), b = val('#sd2');
  if (!a || !b) { sc.error = 'Type both digits to continue.'; return renderScan(); }
  if (a !== digits[sc.pos[0]] || b !== digits[sc.pos[1]]) {
    sc.error = 'Those digits do not match the number on file. Check with your office manager if the number is wrong.';
    return renderScan();
  }
  const already = e.scans.find(s => s.device === sc.device);
  if (already) { sc.result = 'no'; sc.blockedBy = distById(already.distributorId).name; sc.step = 3; return renderScan(); }
  if (e.scans.some(s => s.distributorId === d.id && s.status === 'Accepted')) {
    sc.error = 'You are already marked present for this event.'; return renderScan();
  }
  e.scans.push({ distributorId: d.id, time: '14:' + String(10 + e.scans.length).padStart(2, '0'), device: sc.device, status: 'Accepted' });
  sc.result = 'ok'; sc.step = 3; renderScan();
};
A['scan-again'] = () => { state.scan = { eventId: state.scan.eventId, step: 0, device: newDevice(), q: '' }; renderScan(); };
A['sim-dupe'] = el => {

  const used = e.scans.find(s => s.status === 'Accepted');

  const scanned = e.scans.map(s => s.distributorId);
  const pool = eligiblePool(e).filter(d => !scanned.includes(d.id));
  const d = pool.length ? pool[0] : distById(used.distributorId);
  e.scans.push({ distributorId: d.id, time: '14:' + String(40 + e.scans.length).padStart(2, '0'), device: used.device, status: 'Rejected', reason: 'Phone already used for this event' });

};

        <select class="inp" id="ev-elig"><option value="all">${ELIG.all.label}</option><option value="sm">${ELIG.sm.label}</option></select>
        <span class="hint">This decides who the code accepts and what the headcount is measured against.</span></div>
    </div>`, `<button class="btn btn-g" data-act="modal-close">Cancel</button><button class="btn btn-p" data-act="save-event">Create event</button>`);
};
A['save-event'] = () => {
  const name = val('#ev-name'); if (!name) return toast('Give the event a name.', 'no');
  const cid = val('#ev-center') || myCenter().id, id = 'e' + (attEvents.length + 1);
  attEvents.push({ id, centerId: cid, kind: 'event', type: 'CUSTOM', name, elig: val('#ev-elig') || 'all',
    weekId: CURRENT_WEEK, date: val('#ev-date') || '30 Jul', time: val('#ev-time') || '12:00pm',
    code: 'EV-' + cid.toUpperCase() + '-' + (attEvents.length + 1), status: 'scheduled', scans: [] });
  closeModal(); go(link('event', id)); toast(`${esc(name)} created with its own QR code. Open scanning when it starts.`, 'ok');
};

/* weekly report */
A['save-report'] = () => {
  const orders = parseInt(val('#f-orders'), 10), amount = parseInt(val('#f-amount'), 10);
  if (!orders || orders < 0) return toast('Enter the number of orders.', 'no');
  if (!amount || amount < 0) return toast('Enter the total order amount in dollars.', 'no');
  const niches = (state.form && state.form.niches) || [];
  if (!niches.length) return toast('Add at least one niche the orders came from.', 'no');
  const o = myOffice(), existing = reportFor(o.id, CURRENT_WEEK);
  const data = { orders, amount, niches,
    newNiches: niches.filter(n => !BASE_NICHES.includes(n)),
    officeSize: parseInt(val('#f-size'), 10) || distsOf(o.id).length,
    totalOffice: parseInt(val('#f-total'), 10) || 0,
    issues: val('#f-issues') || 'No issues reported.', submittedAt: 'Today 18:20' };
  if (existing) { Object.assign(existing, data); toast('Report updated before tomorrow\'s evaluation.', 'ok'); }
  else { reports.push({ id: 'r-' + o.id + '-' + CURRENT_WEEK, officeId: o.id, centerId: o.centerId, weekId: CURRENT_WEEK, ...data });
    toast('Report submitted. It goes into tomorrow\'s evaluation list.', 'ok'); }
  state.form = null;
  go(link('report', 'r-' + o.id + '-' + CURRENT_WEEK));
};

/* ============================ NICHE COMBOBOX ============================ */
function paintCombo(keepFocus) {
  const wrap = $('#cb-wrap'); if (!wrap) return;
  wrap.innerHTML = combo();
  if (keepFocus !== false) { const i = $('#cb-input'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
}
function paintMenu() {
  const cb = $('#cb-wrap .cb'); if (!cb) return;
  const old = cb.querySelector('.cb-menu'); if (old) old.remove();
  if (state.form.open) cb.insertAdjacentHTML('beforeend', comboMenu());
}
A['cb-focus'] = (el, ev) => {
  if (ev && ev.target.closest('[data-act="cb-remove"]')) return;
  state.form.open = true; state.form.hi = 0; paintCombo();
};
A['cb-input'] = el => { state.form.q = el.value; state.form.open = true; state.form.hi = 0; paintMenu(); };
A['cb-pick'] = el => addNiche(el.dataset.v);
A['cb-make'] = () => addNiche(state.form.q.trim(), true);
A['cb-remove'] = el => { state.form.niches = state.form.niches.filter(n => n !== el.dataset.v); paintCombo(); };
function addNiche(v, isNew) {
  if (!v) return;
  const match = NICHES.find(n => n.toLowerCase() === v.toLowerCase());
  const name = match || v;
  if (!match) NICHES.push(name);
  if (!state.form.niches.includes(name)) state.form.niches.push(name);
  state.form.q = ''; state.form.hi = 0; state.form.open = true;
  paintCombo();
  if (!match && isNew) toast(`“${esc(name)}” added. It is now in the list for every office, and counts as a new niche on this report.`, 'ok');
}
document.addEventListener('keydown', ev => {
  if (!state.form || ev.target.id !== 'cb-input') return;
  const f = state.form, { hits, canMake } = comboOptions(), total = hits.length + (canMake ? 1 : 0);
  if (ev.key === 'ArrowDown') { ev.preventDefault(); f.open = true; f.hi = total ? (f.hi + 1) % total : 0; paintMenu(); }
  else if (ev.key === 'ArrowUp') { ev.preventDefault(); f.hi = total ? (f.hi - 1 + total) % total : 0; paintMenu(); }
  else if (ev.key === 'Enter') { ev.preventDefault();
    if (canMake && f.hi === hits.length) addNiche(f.q.trim(), true);
    else if (hits[f.hi]) addNiche(hits[f.hi]);
    else if (f.q.trim()) addNiche(f.q.trim(), true); }
  else if (ev.key === 'Escape') { f.open = false; paintCombo(); }
  else if (ev.key === 'Backspace' && !f.q && f.niches.length) { f.niches.pop(); paintCombo(); }
});
document.addEventListener('click', ev => {
  if (!state.form) return;
  const inside = ev.target.closest('.cb');
  if (!inside && state.form.open) { state.form.open = false; paintCombo(false); return; }
  if (inside && ev.target.id === 'cb-input' && !state.form.open) { state.form.open = true; state.form.hi = 0; paintCombo(); }
}, true);

/* ============================ BILLING ============================ */
A['pay-now'] = () => {
  const o = myOffice(), b = o.billing;
  modal(b.method ? 'Change the card on file' : 'Add a card', `${esc(o.name)} · ${ngn(PLAN.amount)} every ${PLAN.days} days`, `
    <div class="stack" style="gap:14px">
      <div class="note n-b">${ico('lock', 17)}<div>This is a stand-in for the Paystack checkout. In the built product this opens Paystack, and the card never touches our servers — we only keep the last four digits and their authorisation code.</div></div>
      <div class="field"><label for="pay-email">Email for the receipt</label><input class="inp" id="pay-email" value="${esc(o.email)}"></div>
      <div class="field"><label for="pay-card">Card number</label><input class="inp" id="pay-card" placeholder="0000 0000 0000 0000" inputmode="numeric"></div>
      <div class="grid g2">
        <div class="field"><label for="pay-exp">Expiry</label><input class="inp" id="pay-exp" placeholder="MM/YY"></div>
        <div class="field"><label for="pay-cvv">CVV</label><input class="inp" id="pay-cvv" placeholder="123" inputmode="numeric" maxlength="4"></div>
      </div>
      ${b.status === 'trial' ? note('b', 'clock', `Your trial runs to ${esc(b.trialEnds)}. Nothing is charged today — the first ${ngn(PLAN.amount)} goes out on ${esc(b.trialEnds)}.`)
        : note('b', 'card', `${ngn(PLAN.amount)} is charged now, and every ${PLAN.days} days after that.`)}
    </div>`,
    `<button class="btn btn-g" data-act="modal-close">Cancel</button>
     <button class="btn btn-p" data-act="pay-submit">${b.status === 'trial' ? 'Save card' : 'Pay ' + ngn(PLAN.amount)}</button>`);
};
A['pay-submit'] = () => {
  const num = val('#pay-card').replace(/\s/g, ''), exp = val('#pay-exp'), cvv = val('#pay-cvv');
  if (num.length < 12) return toast('That card number is too short.', 'no');
  if (!/^\d{2}\s*\/\s*\d{2}$/.test(exp)) return toast('Write the expiry as MM/YY.', 'no');
  if (cvv.length < 3) return toast('The CVV is three or four digits.', 'no');
  const o = myOffice(), b = o.billing, wasTrial = b.status === 'trial';
  const brand = num[0] === '5' ? 'Mastercard' : num[0] === '6' ? 'Verve' : 'Visa';
  b.method = { brand, last4: num.slice(-4), exp: exp.replace(/\s/g, '').replace('/', '/20') };
  if (wasTrial) {
    b.next = b.trialEnds;
    toast(`Card saved. Nothing charged today — the first ${ngn(PLAN.amount)} goes out on ${esc(b.trialEnds)}.`, 'ok');
  } else {
    b.status = 'active'; b.since = b.since || '28 Jul 2026'; b.next = addDays(NOW, PLAN.days);
    payments.push({ id: 'p' + payments.length, officeId: o.id, date: '28 Jul 2026', amount: PLAN.amount,
      ref: 'STI-' + o.id.toUpperCase() + '-' + (2700 + payments.length), status: 'Paid', method: brand + ' •••• ' + num.slice(-4) });
    toast(`${ngn(PLAN.amount)} paid. Next charge ${esc(b.next)}.`, 'ok');
  }
  closeModal(); reload();
};
A['cancel-sub'] = () => {
  const o = myOffice();
  modal('Cancel this subscription?', esc(o.name), note('err', 'alert',
    `The office keeps working until <b>${esc(o.billing.next)}</b>, then goes read-only. Every report, attendance record and ranking already filed stays exactly where it is — you can start paying again any time and pick up where you left off.`),
    `<button class="btn btn-g" data-act="modal-close">Keep it running</button><button class="btn btn-d" data-act="confirm-cancel">Cancel subscription</button>`);
};
A['confirm-cancel'] = () => {
  const o = myOffice();
  o.billing.status = 'past_due'; o.billing.failedOn = o.billing.next; o.billing.retryOn = '—';
  closeModal(); reload(); toast(`Subscription cancelled. ${esc(o.name)} stays open until ${esc(o.billing.failedOn)}.`, 'ok');
};
A['extend-trial'] = el => {
  const o = officeById(el.dataset.id);
  o.billing.trialEnds = addDays(new Date(o.billing.trialEnds), 14);
  o.billing.next = o.billing.trialEnds;
  reload(); toast(`${esc(o.name)} now has until ${esc(o.billing.trialEnds)} before the first charge.`, 'ok');
};

/* ============================ WIRING ============================ */
document.addEventListener('click', ev => {
  const a = ev.target.closest('[data-act]');
  if (a && A[a.dataset.act] && a.tagName !== 'SELECT' && a.tagName !== 'INPUT') { ev.preventDefault(); A[a.dataset.act](a, ev); return; }
  const row = ev.target.closest('tr.clk');
  if (row && row.dataset.href) go(row.dataset.href);
});
document.addEventListener('change', ev => {
  const s = ev.target.closest('select[data-act]');
  if (s && A[s.dataset.act]) A[s.dataset.act](s, ev);
});
document.addEventListener('input', ev => {
  const i = ev.target.closest('input[data-act]');
  if (i && A[i.dataset.act]) A[i.dataset.act](i, ev);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') closeModal();
  if (ev.key === 'Enter') {
    const h = location.hash;
    if (h.includes('login')) A.signin();
    else if (h.includes('forgot')) A['send-reset']();
  }
});
window.addEventListener('hashchange', route);
route();

</script>
</body>
</html>
